<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Scout Pro | Football Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="football.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="scanline"></div>
    <div class="container main-reveal">
        <h1 class="glitch-text"><i class="fa-solid fa-ranking-star"></i> Elite Scout Pro</h1>
        <div class="search-box">
            <input id="playerName" placeholder="Enter Player Name (e.g. Haaland)" autocomplete="off">
            <button id="searchBtn">Analyze Player</button>
        </div>
        <div id="playerResult" class="result-container">
            <!-- Player data will be injected here -->
        </div>
    </div>
    <script src="football.js"></script>
</body>
</html>
