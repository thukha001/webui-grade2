<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Character Search</title>
    <link rel="stylesheet" href="anime.css">
</head>
<body>
    <div class="container">
        <h1>Anime Character Search</h1>
        <div class="search-box">
            <input id="characterName" placeholder="Enter character name (e.g. Luffy)" autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>
        <div id="characterResult" class="result-container">
            <!-- Character details will be injected here -->
        </div>
    </div>
    <script src="anime.js"></script>
</body>
</html>
