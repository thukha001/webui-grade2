<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pokédex Search</h1>
        <div class="search-box">
            <input id="name" placeholder="Enter Pokémon name (e.g. pikachu)" autocomplete="off">
            <button id="section1-btn">Search</button>
        </div>
        <div id="section1-result" class="result-container">
            <!-- Result will be injected here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
